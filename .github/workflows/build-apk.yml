name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 Debug 版 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/tongyin-v0.1-b${{ github.run_number }}.apk"
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tongyin-apk
          path: out/*.apk
          if-no-files-found: error
